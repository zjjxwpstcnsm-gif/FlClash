name: Android Auto Failover

on:
  workflow_dispatch:
  push:
    branches: [auto-failover]

permissions:
  contents: write

concurrency:
  group: android-auto-failover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: github.repository_owner != 'chen08209'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Resolve dependencies and generate source
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run intl_utils:generate
          dart format lib/models/config.dart lib/models/core.dart lib/providers/actions/setup.dart lib/providers/state.dart lib/core/controller.dart lib/core/interface.dart lib/core/method.dart lib/manager/core_manager.dart lib/views/application_setting.dart lib/views/tools.dart test/widgets/smart_failover_test.dart test/models/config_test.dart test/core/protocol_contract_test.dart

      - name: Analyze and test Flutter
        run: |
          flutter analyze --no-fatal-infos
          flutter test --reporter expanded

      - name: Test core routing and failover
        working-directory: core
        run: |
          for attempt in 1 2 3; do
            if GODEBUG=http2client=0 go mod download; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 3
          done
          CGO_ENABLED=0 go test . ./failover
          CGO_ENABLED=0 go vet . ./failover
          go test -race ./failover

      - name: Preserve generated source for this build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test/models/config_test.dart test/widgets/smart_failover_test.dart test/core/protocol_contract_test.dart pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate Flutter models and translations'
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Retain development signing key for subsequent previews
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: flclash-auto-development-signing-v1

      - name: Prepare development signing key
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          fi

      - name: Build Android APKs
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --build-name 0.8.96-auto.2 --build-number $((2026100300 + GITHUB_RUN_NUMBER))

      - name: Prepare downloads
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            unzip -p "$apk" "lib/${abi}/libclash.so" > "$RUNNER_TEMP/libclash-${abi}.so"
            test -s "$RUNNER_TEMP/libclash-${abi}.so"
            go version -m "$RUNNER_TEMP/libclash-${abi}.so"
          done
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/FlClash-Auto-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/FlClash-Auto-armeabi-v7a.apk
          cp AUTO_FAILOVER.md dist/README.md
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FlClash-Auto-Android
          path: dist/
          retention-days: 30

      - name: Publish Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="autofailover-v0.8.96-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*.apk dist/SHA256SUMS.txt --target "$(git rev-parse HEAD)" --title "FlClash Auto 0.8.96 preview ${GITHUB_RUN_NUMBER}" --notes-file AUTO_FAILOVER.md --prerelease
